<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>⊞</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;--column-width:220px;--cell-height:174px;--gap:4px}
body.dark{--bg:#1c1c1e;--panel:#28282b;--field:#222225;--text:#ededf0;--muted:#a1a1aa;--line:#414147;--hover:#36363b;--accent:#f2f2f5;--inverse:#1c1c1e;--danger:#ff9b9b;--shadow:#0006;color-scheme:dark}
body.light{--bg:#f2f2f7;--panel:#fff;--field:#f6f6f8;--text:#242428;--muted:#6e6e78;--line:#d7d7df;--hover:#e9e9ef;--accent:#252529;--inverse:#fff;--danger:#aa2525;--shadow:#0002;color-scheme:light}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:6px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
button:hover{background:var(--hover)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--inverse);border-color:var(--accent)}
button.danger{color:var(--danger)}
button:focus-visible,input:focus-visible{outline:2px solid var(--text);outline-offset:3px}
header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--line)}
.header-left{display:flex;align-items:center;gap:10px}
h1{font-size:14px;font-weight:650}
#themeDot{width:11px;height:11px;border:0;border-radius:50%;padding:0;background:var(--accent);outline-offset:5px}
.header-btns{display:flex;gap:6px;flex-wrap:wrap}
#maskBtn{border:0;background:transparent;padding:0;width:22px;height:26px;font-size:22px;line-height:1;color:var(--muted)}
body.covered header{background:var(--bg);border-color:transparent}
body.covered h1,body.covered #themeDot,body.covered .header-btns,body.covered .axis-bar,body.covered .layout,body.covered footer{display:none}
#entryDialog,#folderDialog,#batchDialog{position:fixed;inset:0;z-index:20;height:max-content}
body.covered #entryDialog,body.covered #folderDialog,body.covered #batchDialog{display:none}
.upload-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;padding:4px;flex:0 0 32px}
.upload-icon svg{width:18px;height:18px}
.axis-bar{padding:10px 16px 8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);flex-shrink:0}
#counts{margin-left:auto}
.layout{flex:1;min-height:0;display:flex;padding:0 16px 12px;gap:8px}
.y-axis{writing-mode:vertical-lr;color:var(--muted);font-size:11px;letter-spacing:2px;padding-top:90px;flex-shrink:0}
.grid-scroll{flex:1;min-width:0;overflow:auto;position:relative;border-radius:8px}
#grid{display:grid;grid-template-columns:32px;gap:var(--gap);width:max-content;align-items:stretch}
.row-labels,.column{min-width:0;display:flex;flex-direction:column;gap:var(--gap)}
.row-labels{position:sticky;left:0;z-index:2;background:var(--bg)}
.corner{height:44px;position:sticky;top:0;z-index:3;background:var(--bg);flex-shrink:0}
.row-number{height:var(--cell-height);flex-shrink:0;border-radius:8px;border:1px solid var(--line);background:var(--field);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.folder-header{height:44px;flex-shrink:0;position:sticky;top:0;z-index:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:flex;align-items:center;gap:6px;min-width:0}
.folder-name{flex:1;font-size:12px;font-weight:650;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;min-width:0}
.folder-header button{padding:3px 6px;font-size:11px}
.folder-header.missing .folder-name{text-decoration:line-through;color:var(--muted)}
.card{height:var(--cell-height);flex-shrink:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:flex;flex-direction:column;gap:4px;min-width:0}
.card.missing{border-style:dashed}
.card.batch-selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card-select,.batch-toggle input{width:14px;height:14px;padding:0;flex:0 0 14px;accent-color:var(--text)}
.batch-controls{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.dialog-body label.batch-toggle{flex-direction:row;align-items:center;gap:8px;color:var(--text)}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.4;cursor:grabbing}
.card.drop-before{box-shadow:0 -3px 0 var(--accent)}
.column.drop-target{outline:1px dashed var(--accent);outline-offset:1px;border-radius:8px}
.column.drop-end .add-entry{box-shadow:0 -3px 0 var(--accent)}
.drag-ghost{position:fixed;top:0;left:0;z-index:100;pointer-events:none;padding:10px 18px;border:1px solid var(--accent);border-radius:8px;background:var(--panel);color:var(--text);font-size:12px}
.card-tools{height:21px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.card-state{font-size:10px;color:var(--muted);margin-right:auto}
.card-tools button{font-size:11px;padding:2px 6px}
.field{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0;height:20px;line-height:20px;flex-shrink:0}
.field-label{color:var(--muted);width:26px;flex-shrink:0}
.field-value{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.missing .name-value{text-decoration:line-through;color:var(--muted)}
.credential{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.concealed{color:var(--muted);letter-spacing:2px;user-select:none}
.password-eye{width:22px;height:20px;flex:0 0 22px;padding:1px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.password-eye svg{width:16px;height:16px;pointer-events:none}
.password-eye[aria-pressed="true"]{color:var(--text)}
.password-eye[aria-pressed="true"] .eye-slash{display:none}
.jump{width:100%;margin-top:auto;padding:3px 8px;flex-shrink:0}
.add-entry{height:32px;flex-shrink:0;border-style:dashed;background:transparent;color:var(--muted)}
.empty-card{height:var(--cell-height);flex-shrink:0;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:var(--field)}
#empty{padding:60px 20px;text-align:center;font-size:13px;color:var(--muted);line-height:2}
footer{padding:6px 16px 12px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;flex-shrink:0;color:var(--muted);font-size:11px}
#status[data-error="true"]{color:var(--danger)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;width:min(480px,calc(100vw - 32px));max-height:90vh;overflow:auto;padding:22px;margin:auto;box-shadow:0 16px 60px var(--shadow)}
dialog::backdrop{background:#0008;backdrop-filter:blur(3px)}
dialog h2{font-size:16px;margin-bottom:16px}
.dialog-body{display:flex;flex-direction:column;gap:12px}
.dialog-body label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
input{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:9px 10px;font-size:13px}
.dialog-hint{font-size:12px;line-height:1.8;color:var(--muted)}
.dialog-error{font-size:12px;color:var(--danger);min-height:18px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
[hidden]{display:none!important}
@media(max-width:640px){header{padding:10px}.header-btns{width:100%}.header-btns button{flex:1}.header-btns .upload-icon{flex:0 0 32px}.axis-bar{padding:8px 10px}.layout{padding:0 10px 10px;gap:4px}.y-axis{display:none}footer{padding:6px 10px 10px}}
</style>
</head>
<body class="dark covered">
<header>
  <div class="header-left"><button id="maskBtn" type="button" aria-label="切换显示" aria-pressed="false">⊞</button><h1>地址门户</h1><button id="themeDot" type="button" title="切换黑白主题" aria-label="切换黑白主题"></button></div>
  <div class="header-btns">
    <button id="syncBtn" type="button" class="primary upload-icon" title="上传收藏 HTML（浏览器书签管理器 → 导出书签）" aria-label="上传收藏 HTML 并同步"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 18v-7m-3 3 3-3 3 3"/></svg></button>
    <button id="batchBtn" type="button" title="勾选多个网页，批量修改门户登记的账号或密码" aria-pressed="false">批量修改</button>
    <span id="batchControls" class="batch-controls" hidden><button id="batchAll" type="button">全选</button><button id="batchNone" type="button">取消全选</button><span id="batchCount" role="status" aria-live="polite">已选 0 条</span><button id="batchEdit" type="button" class="primary">修改所选</button></span>
    <button id="exportBtn" type="button">导出 JSON</button>
    <button id="importBtn" type="button">导入 JSON</button>
  </div>
</header>
<div class="axis-bar"><span>收藏栏文件夹 →</span><button id="addFolderBtn" type="button">＋ 手动新增文件夹</button><span id="counts">0 个文件夹 · 0 条记录</span></div>
<div class="layout">
  <div class="y-axis">文件夹中的网页 ↓</div>
  <div class="grid-scroll" id="scroller"><div id="grid"></div><div id="empty">上传收藏 HTML 或导入 JSON</div></div>
</div>
<footer><span id="status" role="status" aria-live="polite">首次操作请选择 HTML 所在目录</span><span title="混淆密钥固定写在 HTML 中，可还原，不提供安全保密">离线 · 无口令混淆自动保存</span></footer>
<input id="bookmarkFile" type="file" accept=".html,.htm,text/html" hidden>
<input id="jsonFile" type="file" accept=".json,application/json" hidden>
<dialog id="folderDialog" aria-labelledby="folderTitle">
  <h2 id="folderTitle">手动新增文件夹</h2>
  <div class="dialog-body"><label>文件夹名称<input id="folderName" autocomplete="off" maxlength="200" placeholder="例如：工作系统"></label><p id="folderError" class="dialog-error" role="alert"></p></div>
  <div class="dialog-actions"><button id="folderCancel" type="button">取消</button><button id="folderSave" type="button" class="primary">新增</button></div>
</dialog>
<dialog id="entryDialog" aria-labelledby="entryTitle">
  <h2 id="entryTitle">登记账号密码</h2>
  <div class="dialog-body">
    <label>名称<input id="entryName" autocomplete="off" maxlength="300"></label>
    <label>网址<input id="entryUrl" autocomplete="off" maxlength="4096" spellcheck="false"></label>
    <label>登录域（可选，仅跨域跳转时填写）<input id="entryLoginOrigin" autocomplete="off" maxlength="4096" spellcheck="false" placeholder="粘贴最终登录页网址，保存时只保留协议、域名和端口"></label>
    <label>账号<input id="entryUsername" autocomplete="off" maxlength="1000" spellcheck="false" autocapitalize="off"></label>
    <label>密码<input id="entryPassword" type="text" autocomplete="off" maxlength="4096" spellcheck="false" autocapitalize="off" placeholder="输入密码"></label>
    <p id="entryHint" class="dialog-hint">编辑时明文显示已有密码；输入新值替换，留空仍保留原值。编辑名称后，下次同步将以新名称匹配。</p>
    <p id="entryError" class="dialog-error" role="alert"></p>
  </div>
  <div class="dialog-actions"><button id="entryCancel" type="button">取消</button><button id="entrySave" type="button" class="primary">保存</button></div>
</dialog>
<dialog id="batchDialog" aria-labelledby="batchTitle">
  <h2 id="batchTitle">批量修改账号密码</h2>
  <div class="dialog-body">
    <p id="batchSummary" class="dialog-hint"></p>
    <label class="batch-toggle"><input id="batchChangeUsername" type="checkbox">统一修改账号</label>
    <label>新账号<input id="batchUsername" autocomplete="off" maxlength="1000" spellcheck="false" autocapitalize="off" placeholder="未勾选时保留各自账号" disabled></label>
    <label class="batch-toggle"><input id="batchChangePassword" type="checkbox" checked>统一修改密码</label>
    <label>新密码<input id="batchPassword" type="text" autocomplete="off" maxlength="4096" spellcheck="false" autocapitalize="off" placeholder="输入统一的新密码"></label>
    <p class="dialog-hint">未勾选的字段保持原值；勾选后须填写新值。这里只修改门户登记信息，不修改网站上的实际密码。</p>
    <p id="batchError" class="dialog-error" role="alert"></p>
  </div>
  <div class="dialog-actions"><button id="batchCancel" type="button">取消</button><button id="batchSave" type="button" class="primary">应用修改</button></div>
</dialog>
<dialog id="fileDialog" aria-labelledby="fileTitle">
  <h2 id="fileTitle">文件提示</h2>
  <div class="dialog-body">
    <p id="fileHint" class="dialog-hint"></p>
    <label id="legacyLabel" hidden>旧版文件的原口令（仅迁移这一次）<input id="legacyPassword" type="password" autocomplete="off" maxlength="1024" spellcheck="false" autocapitalize="off"></label>
    <p id="fileError" class="dialog-error" role="alert"></p>
  </div>
  <div class="dialog-actions"><button id="fileImport" type="button">导入备份</button><button id="fileDirectory" type="button">重新选择目录</button><button id="fileClose" type="button">关闭</button><button id="legacySubmit" type="button" class="primary" hidden>迁移为无口令混淆</button></div>
</dialog>
<script>
'use strict';
const FORMAT = 'pswd-util', VERSION = 2, LEGACY_ITERATIONS = 600000;
const FILE_NAME = 'password-manager.json';
// 按需求固定写在 HTML 中，仅作可逆混淆，不能提供真正的密码保密。
const FIXED_KEY_TEXT = 'password-manager-fixed-obfuscation-v2';
const MAX_FILE = 8 * 1024 * 1024, MAX_FOLDERS = 100, MAX_ENTRIES = 5000;
const MASK = '••••••••', THEME_KEY = 'pswd-util-theme';
const $ = id => document.getElementById(id);
let state = {folders:[]}, masked = false, dirty = false, busy = false;
let editing = null, pendingLegacy = null, lastFileError = null;
let fileContext = null, directoryHandle = null, rememberedHandle = null, locked = false, booting = true, bootTask = null;
let saveTimer = null, saveTask = null, connectionTask = null, changeVersion = 0, fixedKeyPromise = null;
let currentTheme = 'dark';
let latestExtensionRequest = null, extensionTimer = null;
let draggedEntryId = null, dragGhost = null, dragPointer = null, dragScrollFrame = null;
const suspendedDialogs = new Set(), selectedEntryIds = new Set();
let batchMode = false, batchTargets = null;
const HANDLE_DB = 'pswd-util-file-links', HANDLE_STORE = 'handles';
const HANDLE_ID = location.href.split(/[?#]/)[0];
function uid(){ return crypto.randomUUID(); }
function editingOpen(){ return $('entryDialog').open || $('folderDialog').open || $('batchDialog').open; }
function canMutate(){ return !masked && !busy && !locked && !booting && !editingOpen() && !batchMode; }
function canSelectBatch(){ return batchMode && !masked && !busy && !locked && !booting && !editingOpen() && Boolean(fileContext); }
function buildSnapshot(){ return structuredClone({format:FORMAT, version:VERSION, folders:state.folders, preferences:{masked, theme:currentTheme}}); }
function validatePreferences(value){
  if(value === undefined) return {masked:false, theme:'dark'};
  if(!value || typeof value.masked !== 'boolean' || !['dark','light'].includes(value.theme)) throw new Error('显示状态或主题格式不正确');
  return {masked:value.masked, theme:value.theme};
}
function restorePreferences(value){ const preferences = validatePreferences(value); masked = preferences.masked; applyTheme(preferences.theme, false); }
function status(message, error = false){ $('status').textContent = message; $('status').dataset.error = String(error); }
function changed(message = '有未保存的更改'){
  dirty = true; changeVersion++; status(fileContext ? '正在自动保存…' : message);
  if(fileContext) scheduleAutoSave(); else status('首次操作请授权 HTML 所在目录', true);
}
function updateConnectionUI(){
  $('maskBtn').disabled = busy || booting;
  ['syncBtn','exportBtn','addFolderBtn'].forEach(id => { $(id).disabled = !canMutate(); });
  $('importBtn').disabled = busy || booting || editingOpen() || batchMode;
  updateBatchUI();
}
function runAction(handler, pickerLabel = ''){
  return async () => {
    if(batchMode || busy || booting || !await ensureFile() || batchMode) return;
    // 目录选择会消耗用户激活，浏览器不允许随即再打开第二个文件选择器。
    if(pickerLabel && navigator.userActivation && !navigator.userActivation.isActive){ status('默认 JSON 已连接，请再次点击「' + pickerLabel + '」选择文件'); return; }
    await handler();
  };
}
// 浏览器只记住授权目录句柄，不缓存登记内容；混淆密钥固定保存在本 HTML 中。
async function handleStore(mode, handle){
  const db = await new Promise((resolve, reject) => {
    const request = indexedDB.open(HANDLE_DB, 1), timer = setTimeout(() => reject(new Error('文件关联读取超时')), 3000);
    request.onupgradeneeded = () => { request.result.createObjectStore(HANDLE_STORE); };
    request.onsuccess = () => { clearTimeout(timer); resolve(request.result); };
    request.onerror = request.onblocked = () => { clearTimeout(timer); reject(request.error || new Error('浏览器不允许记住文件关联')); };
  });
  return new Promise((resolve, reject) => {
    let transaction, result;
    try{
      transaction = db.transaction(HANDLE_STORE, mode);
      const store = transaction.objectStore(HANDLE_STORE);
      const request = mode === 'readonly' ? store.get(HANDLE_ID) : handle === null ? store.delete(HANDLE_ID) : store.put(handle, HANDLE_ID);
      request.onsuccess = () => { result = request.result; };
      transaction.oncomplete = () => { db.close(); resolve(result); };
      transaction.onerror = transaction.onabort = () => { db.close(); reject(transaction.error || new Error('文件关联保存失败')); };
    }catch(error){ db.close(); reject(error); }
  });
}
function rememberHandle(handle){ return handleStore('readwrite', handle); }
async function fileText(handle){ const file = await handle.getFile(); if(file.size > MAX_FILE) throw new Error('JSON 文件不得超过 8 MiB'); return file.text(); }
async function readEnvelope(handle){ return JSON.parse(await fileText(handle)); }
function isLegacy(value){ return value?.format === FORMAT && value.version === 1 && value.encrypted === true; }
async function loadDirectory(directory, allowCreate){
  let handle, created = false;
  try{ handle = await directory.getFileHandle(FILE_NAME); }
  catch(error){ if(error.name !== 'NotFoundError' || !allowCreate) throw error; handle = await directory.getFileHandle(FILE_NAME, {create:true}); created = true; }
  let content = await fileText(handle);
  fileContext = {handle, directory, lastText:content, creating:created}; locked = true;
  if(created || !content.trim()){
    if(!allowCreate) throw new Error('请点击 ⊞ 授权目录后创建 JSON');
    content = await writeJson(handle, await obfuscateSnapshot(buildSnapshot())); fileContext.lastText = content; fileContext.creating = false;
  }
  const envelope = JSON.parse(content);
  if(isLegacy(envelope)){
    pendingLegacy = {envelope, handle, content}; masked = envelope.masked ?? true;
    lastFileError = new Error('旧版 JSON 使用过口令，需输入原口令迁移一次；原文件尚未改动');
    status(lastFileError.message, true); return false;
  }
  const restored = await decodeSnapshot(envelope); state = restored; restorePreferences(restored.preferences);
  locked = false; dirty = false; pendingLegacy = null; changeVersion++;
  status('已连接 ' + FILE_NAME + ' · 无口令自动保存'); return true;
}
function restoreConnection(){
  if(bootTask) return bootTask;
  bootTask = (async () => {
    try{
      rememberedHandle = await handleStore('readonly');
      if(rememberedHandle?.kind === 'directory'){
        directoryHandle = rememberedHandle; locked = true;
        if(await directoryHandle.queryPermission({mode:'read'}) === 'granted'){
          const allowCreate = await directoryHandle.queryPermission({mode:'readwrite'}) === 'granted';
          await withFileLock(directoryHandle, () => loadDirectory(directoryHandle, allowCreate));
        }else status('点击 ⊞ 重新授权保存目录');
      }else if(rememberedHandle){ locked = true; status('点击 ⊞ 选择 HTML 所在目录，旧文件不会自动覆盖'); }
    }catch(error){ lastFileError = error; status('读取 JSON 失败：' + error.message, true); }
    finally{ booting = false; render(); }
  })();
  return bootTask;
}
function withFileLock(handle, operation){ return navigator.locks?.request ? navigator.locks.request('pswd-util-write:' + FILE_NAME, operation) : operation(); }
async function writableTarget(context){
  if(await context.directory.queryPermission({mode:'readwrite'}) !== 'granted') throw new Error('目录权限已失效，请再次执行当前操作并重新授权');
  let handle;
  try{ handle = await context.directory.getFileHandle(FILE_NAME); }
  catch(error){
    if(error.name !== 'NotFoundError') throw error;
    handle = await context.directory.getFileHandle(FILE_NAME, {create:true}); context.creating = true;
  }
  const content = await fileText(handle);
  if(!(context.creating && !content.trim()) && content !== context.lastText) throw new Error('JSON 已被其他页面或程序修改，请重新导入；未覆盖文件');
  context.handle = handle; return handle;
}
function scheduleAutoSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(flushAutoSave, 150); }
function flushAutoSave(checkFile = false){
  clearTimeout(saveTimer); saveTimer = null;
  if(saveTask) return saveTask;
  if(!fileContext || locked || (!dirty && !checkFile)) return Promise.resolve(!dirty && !locked);
  const context = fileContext;
  saveTask = (async () => {
    do{
      const revision = changeVersion, envelope = await obfuscateSnapshot(buildSnapshot());

$('syncBtn').addEventListener('click', runAction(() => $('bookmarkFile').click(), '上传收藏 HTML'));
$('batchBtn').addEventListener('click', () => { if(batchMode) exitBatchMode(); else runAction(enterBatchMode)(); });
$('batchAll').addEventListener('click', () => selectAllBatch(true));
$('batchNone').addEventListener('click', () => selectAllBatch(false));
$('batchEdit').addEventListener('click', openBatchDialog);
$('batchSave').addEventListener('click', saveBatch);
$('batchCancel').addEventListener('click', () => { if(!busy){ $('batchDialog').close(); clearBatchDraft(); render(); } });
$('batchDialog').addEventListener('close', () => { if(!$('batchDialog').open && !suspendedDialogs.has('batchDialog')){ clearBatchDraft(); render(); } });
$('batchDialog').addEventListener('cancel', event => event.preventDefault());
['batchChangeUsername','batchChangePassword'].forEach(id => $(id).addEventListener('change',updateBatchUI));
$('importBtn').addEventListener('click', runAction(chooseJson, '导入 JSON'));
$('exportBtn').addEventListener('click', () => { if(fileContext) exportJson(); else runAction(exportJson)(); });
$('bookmarkFile').addEventListener('change', async event => { const file = event.target.files[0]; event.target.value = ''; await importBookmarks(file); });
$('jsonFile').addEventListener('change', async event => { const file = event.target.files[0]; event.target.value = ''; await importJson(file); });
$('addFolderBtn').addEventListener('click', runAction(openFolder));
$('folderSave').addEventListener('click', saveFolder);
$('folderCancel').addEventListener('click', () => { $('folderDialog').close(); $('folderName').value = ''; render(); flushAutoSave(true); });
$('folderDialog').addEventListener('close', () => { if(!$('folderDialog').open && !suspendedDialogs.has('folderDialog')){ $('folderName').value = ''; render(); } });
$('folderDialog').addEventListener('cancel', event => event.preventDefault());
$('folderName').addEventListener('keydown', event => { if(event.key === 'Enter'){ event.preventDefault(); saveFolder(); } });
$('entrySave').addEventListener('click', saveEntry);
$('entryCancel').addEventListener('click', () => { $('entryDialog').close(); clearEntry(); render(); flushAutoSave(true); });
$('entryDialog').addEventListener('close', () => { if(!$('entryDialog').open && !suspendedDialogs.has('entryDialog')){ clearEntry(); render(); } });
$('entryDialog').addEventListener('cancel', event => event.preventDefault());
$('legacySubmit').addEventListener('click', submitLegacy);
$('fileClose').addEventListener('click', () => { if(!busy){ $('legacyPassword').value = ''; $('fileDialog').close(); } });
$('fileImport').addEventListener('click', chooseJson);
$('fileDirectory').addEventListener('click', () => { if(busy) return; $('fileDialog').close(); directoryHandle = null; pendingLegacy = null; connectOrSave(); });
$('fileDialog').addEventListener('close', () => { if(!$('fileDialog').open){ $('legacyPassword').value = ''; if(!locked) pendingLegacy = null; } });
$('fileDialog').addEventListener('cancel', event => { if(busy) event.preventDefault(); });
$('legacyPassword').addEventListener('keydown', event => { if(event.key === 'Enter'){ event.preventDefault(); submitLegacy(); } });
document.addEventListener('keydown', event => { if(event.key === 'Escape' && !editingOpen() && !$('fileDialog').open) hideAll(); });
window.addEventListener('beforeunload', event => {
  const entryDraft = ($('entryDialog').open || suspendedDialogs.has('entryDialog')) && ['entryName','entryUrl','entryLoginOrigin','entryUsername','entryPassword'].some(id => $(id).value);
  const folderDraft = ($('folderDialog').open || suspendedDialogs.has('folderDialog')) && $('folderName').value;
  const batchDraft = ($('batchDialog').open || suspendedDialogs.has('batchDialog')) && ['batchUsername','batchPassword'].some(id => $(id).value);
  if(dirty || busy || saveTask || entryDraft || folderDraft || batchDraft){ event.preventDefault(); event.returnValue = ''; }
});
render(); restoreConnection();
</script>
</body>
</html>
